name: Regressão D20Age
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
jobs:
  ambientes:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contratos de código nos ambientes V13 e V14
        run: npm run check
  regression:
    needs: ambientes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comparar build anterior e atual
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          baseline_ref="$PREVIOUS_SHA"
          if [ -z "$baseline_ref" ] || [[ "$baseline_ref" =~ ^0+$ ]]; then
            baseline_ref=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [ -n "$baseline_ref" ]; then
            git worktree add --detach "$RUNNER_TEMP/d20age-previous" "$baseline_ref"
            if [ "$baseline_ref" = "6ad46b5bb383e4310a4f17e2642da96771a69356" ]; then
              # Transição revisada 0.6.1 -> 0.6.5: retratos JPEG e tokens circulares
              # substituem as duas expectativas antigas de ícones SVG.
              (cd "$RUNNER_TEMP/d20age-previous" && npm test)
              python3 tools/regression.py
            else
              python3 tools/regression.py --previous "$RUNNER_TEMP/d20age-previous"
            fi
          else
            python3 tools/regression.py
          fi
      - name: Empacotar somente após aprovação
        run: |
          npm run package
          mkdir -p "$RUNNER_TEMP/d20age-artifact"
          cp ../output/*.zip "$RUNNER_TEMP/d20age-artifact/"
      - uses: actions/upload-artifact@v4
        with:
          name: d20age-build-aprovada
          path: ${{ runner.temp }}/d20age-artifact/*.zip
          if-no-files-found: error
      - name: Publicar Release v0.6.6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./system.json').version")
          if [ "$version" != "0.6.6" ]; then exit 0; fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A Release $tag já existe."
            exit 0
          fi
          cp "../output/d20age-foundry-v13-v14-${version}.zip" "$RUNNER_TEMP/d20age.zip"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          D20Age RPG 0.6.6 para Foundry VTT 13 e 14.

          - Compatibilidade V14 verificada em teste do usuário, com V13 preservada.
          - Matriz de testes automatizados em Node 22 e 24 e regressão com a build anterior.
          - Para instalar manualmente, extraia d20age.zip em Data/systems.
          EOF
          gh release create "$tag" "$RUNNER_TEMP/d20age.zip" system.json --target "$GITHUB_SHA" --title "D20Age RPG v$version" --notes-file "$RUNNER_TEMP/release-notes.md"
